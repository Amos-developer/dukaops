spring.application.name=dukaops-backend
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.mail.from=${MAIL_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
server.port=8000
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:dukaops_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:3698}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Application monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Twilio credentials are server-only. SMS stays off until explicitly enabled.
dukaops.sms.enabled=${TWILIO_SMS_ENABLED:false}
dukaops.sms.account-sid=${TWILIO_ACCOUNT_SID:}
dukaops.sms.auth-token=${TWILIO_AUTH_TOKEN:}
dukaops.sms.from=${TWILIO_FROM:}
