
services:
  db:
    image: postgres:16-alpine
    container_name: dukaops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dukaops_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-3698}
    ports:
      - "5432:5432"
    volumes:
      - dukaops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dukaops_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./dukaops-backend
    container_name: dukaops-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-dukaops_db}
      POSTGRES_DB: ${POSTGRES_DB:-dukaops_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-3698}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./dukaops-frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8001/api}
        VITE_API_USERNAME: ${VITE_API_USERNAME:-}
        VITE_API_PASSWORD: ${VITE_API_PASSWORD:-}
    container_name: dukaops-frontend
    restart: unless-stopped
    ports:
      - "5173:80"

volumes:
  dukaops_postgres_data:
